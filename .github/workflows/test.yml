name: CI

on:
  push:
    branches: [ main, develop ]
    # A commit touching ONLY docs does not need two ~25-minute integration
    # jobs: run 30708366878 spent 46 minutes of runner time on a single .md
    # file. Note this skips a run only when EVERY changed path matches — a
    # commit that touches code and docs together still runs the full suite.
    paths-ignore:
      - '**.md'
      - 'doc/**'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'doc/**'

# Pushing twice a few minutes apart used to leave two full runs (4 jobs each,
# ~35 min) racing, which both wastes runners and makes "which run is current"
# ambiguous. Supersede the older run instead.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The ad SDK package owns all the automated tests (unit/widget/integration
  # under packages/ad_sdk/test/). This is the primary gate.
  sdk:
    name: ad_sdk — analyze & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/ad_sdk
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.1'
          channel: 'stable'
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Run tests
        run: flutter test

  # T47 — the 20 integration_test/ files under packages/ad_sdk/example only ran
  # by hand on a simulator/device before this. Runs them on a real Android
  # emulator so real-device-shaped regressions (not just Dart-VM-reachable
  # ones) are caught in CI too. AdMob App ID/unit IDs in the example are
  # already Google's test IDs (see CLAUDE.md), so this is safe to run
  # unattended without risking real ad revenue/policy signals.
  sdk-integration:
    name: ad_sdk example — integration tests (Android emulator)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.1'
          channel: 'stable'
      - name: Install dependencies
        working-directory: packages/ad_sdk/example
        run: flutter pub get
      - name: Enable KVM (required for the emulator to boot on Linux runners)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # Flaky since ~2026-07-19: job gets killed mid-run with no test-failure
      # output and no uploaded logs — the signature of the Linux OOM killer,
      # not a real test failure (ubuntu-latest has 7GB RAM and no swap by
      # default; emulator + KVM + `flutter test` across 20 integration_test/
      # files can exceed that). Free up disk (unused dotnet/haskell/boost
      # toolchains) before adding swap — the AVD's userdata partition alone
      # needs ~7.4GB, so an oversized swapfile can starve emulator creation.
      - name: Free disk space (headroom for swap + emulator userdata partition)
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost
          docker image prune -af || true
          df -h /
      - name: Add swap space (avoids OOM-killed emulator on GitHub-hosted runners)
        run: |
          sudo swapoff -a
          sudo fallocate -l 3G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
      # Every test was failing identically at "SDK must finish initialising on
      # device" (30s timeout) — logcat (captured below) showed the real cause:
      # "SDK key provided is invalid (YOUR_86_CHAR_SDK_KEY_FROM_APPLOVIN_DASHBOARD)".
      # No real AppLovin credentials are committed (see main.dart T41 comment)
      # so the default AppLovin path can never init in CI. AD_PROVIDER_ADMOB
      # switches to Google's public AdMob test ad-unit IDs, which need no
      # secret and always init. (google_apis_playstore vs google_apis made no
      # difference to this — reverted to the plain image.)
      #
      # app_open/interstitial/rewarded_ad_test.dart are excluded below: their
      # own header comments say a HUMAN must manually tap the ad's close/X
      # button for the test to pass — there's no unattended way to dismiss a
      # real ad creative in headless CI, so they always time out here by
      # design, not from a regression. Run them by hand on a real device/sim.
      - name: Run integration tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          ram-size: 2048M
          heap-size: 256M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          working-directory: packages/ad_sdk/example
          # Same per-file isolation + one retry as the iOS job below, for the
          # same reason: a single invocation lets one bad app launch hide every
          # remaining file behind a 12-minute timeout. Android has not shown
          # that failure yet, but it has the identical shape, and being green
          # today is not evidence the shape is safe. Retries are logged by name
          # so a real regression cannot hide behind "it passed on the retry".
          #
          # KEEP THIS POSIX sh. Unlike the iOS job's `run:` block (bash on the
          # GitHub runner), android-emulator-runner executes `script:` with
          # /bin/sh, which is dash on Ubuntu — no arrays. A first attempt used
          # `failed=()` / `${#failed[@]}` and the job died in 3m31s with
          # "The process '/usr/bin/sh' failed with exit code 2", which is
          # dash's `Syntax error: "(" unexpected`. `bash -n` does not catch
          # this; validate with `dash -n` (or just `dash`) instead.
          script: |
            adb logcat -c
            adb logcat > /tmp/logcat.txt &
            run_one() {
              flutter test "$1" --dart-define=AD_PROVIDER_ADMOB=true
            }
            failed=""
            retried=""
            for f in $(ls integration_test/*_test.dart | grep -Ev '/(app_open|interstitial|rewarded)_ad_test\.dart$'); do
              echo "::group::$f"
              if run_one "$f"; then
                echo "::endgroup::"
                continue
              fi
              echo "::endgroup::"
              echo "::warning file=$f::first attempt failed — retrying once"
              retried="$retried $f"
              echo "::group::$f (retry)"
              if run_one "$f"; then
                echo "::endgroup::"
              else
                echo "::endgroup::"
                echo "::error file=$f::integration test failed on both attempts"
                failed="$failed $f"
              fi
            done
            if [ -n "$retried" ]; then
              echo "::warning::Files that needed a retry:$retried"
            fi
            if [ -n "$failed" ]; then
              echo "Failed files (both attempts):$failed"
              exit 1
            fi
      - name: Upload logcat
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-emulator-logcat
          path: /tmp/logcat.txt
          if-no-files-found: ignore

  # N5 — the Android emulator job above never caught iOS-only regressions
  # (e.g. the ATT/UMP no-timeout wedge, App-Open auto-redirect on iOS
  # Simulator — see SKIP_ATT/SKIP_UMP/SKIP_SPLASH_AD dart-defines below).
  # Runs the same integration_test suite on an iOS Simulator.
  sdk-integration-ios:
    name: ad_sdk example — integration tests (iOS Simulator)
    runs-on: macos-15
    defaults:
      run:
        working-directory: packages/ad_sdk/example
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.1'
          channel: 'stable'
      # connectivity_plus 7.3.0 (transitive via internet_connection_checker_plus)
      # uses NWPath.isUltraConstrained, only in the iOS 26 SDK — the macos-15
      # image ships Xcode 26.1.1 but doesn't default to it.
      - name: Select Xcode 26.1.1
        run: sudo xcode-select -s /Applications/Xcode_26.1.1.app
      - name: Install dependencies
        run: flutter pub get
      - name: Install CocoaPods dependencies
        working-directory: packages/ad_sdk/example/ios
        run: pod install
      - name: Boot iOS Simulator
        run: |
          # macos-15's device list moved on from "iPhone 15" (not present in
          # any runtime on this image) — "iPhone 16" is available on every
          # runtime the image ships (18.5, 18.6, 26.0, 26.1, 26.2).
          UDID=$(xcrun simctl list devices available | grep -m1 'iPhone 16' | grep -oE '[0-9A-F-]{36}')
          echo "SIMULATOR_UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID"
      # interstitial/rewarded show+dismiss need a real ad fill, which the
      # invalid placeholder AppLovin key (see Android job comment above) can
      # never provide — same AD_PROVIDER_ADMOB switch to Google's public
      # AdMob test ad-unit IDs fixes it here too.
      # app_open/interstitial/rewarded_ad_test.dart need a human to manually
      # tap the ad's close/X button (see their header comments) — excluded
      # below, same reason as the Android job above.
      # One `flutter test` invocation PER FILE, not one for all 18.
      #
      # Passing every file to a single invocation makes one bad app launch
      # destroy the whole job. Observed on run 30697397657: after the first
      # file finished, the app for app_boot_test.dart never started — 11
      # minutes of completely silent log (not even AdManager's cold-start
      # line) until the 12-minute per-test timeout fired, then banner_ad_test
      # died with "Failed to start Dart Development Service" and
      # "Unable to terminate com.example.adSdkExample ... found nothing to
      # terminate". The remaining 16 files then ran fine, ~1min each with no
      # upward drift, so this is a flaky app launch/teardown on the CI
      # simulator, not resource exhaustion and not a Dart-side bug (the same
      # 18 files pass 23/23 in a single invocation on a local simulator).
      #
      # Splitting costs almost nothing: the log shows `flutter test` already
      # rebuilds and relaunches the app between files (a ~34s Xcode step), so
      # that price is being paid either way. What it buys is isolation — a
      # launch flake fails one file instead of hiding the other 17 — plus the
      # name of the file that actually broke.
      #
      # Each file also gets ONE retry, because the isolation above showed the
      # flake is random rather than tied to a specific test: run 30697397657
      # lost app_boot_test.dart, run 30704574568 lost
      # fill_rate_monitor_demo_test.dart, both with the same signature (~12min
      # of silent log, no Dart output at all, then the per-test timeout) while
      # every other file passed. A retry is containment, not a cure — so every
      # retry is logged as a ::warning naming the file, which is the only way
      # to tell "the flake is getting worse" from "we are quietly papering over
      # a real failure". A file that fails TWICE still fails the job.
      - name: Run integration tests
        run: |
          run_one() {
            flutter test "$1" \
              -d "$SIMULATOR_UDID" \
              --dart-define=SKIP_SPLASH_AD=true \
              --dart-define=SKIP_ATT=true \
              --dart-define=SKIP_UMP=true \
              --dart-define=AD_PROVIDER_ADMOB=true
          }
          failed=()
          retried=()
          for f in $(ls integration_test/*_test.dart | grep -Ev '/(app_open|interstitial|rewarded)_ad_test\.dart$'); do
            echo "::group::$f"
            if run_one "$f"; then
              echo "::endgroup::"
              continue
            fi
            echo "::endgroup::"
            echo "::warning file=$f::first attempt failed — retrying once (known CI simulator app-launch flake)"
            retried+=("$f")
            # Grab evidence BEFORE the retry relaunches the app and overwrites
            # the interesting state. The hang has never reproduced locally
            # (18/18 files pass three times on a local simulator), so CI is the
            # only place this data exists — and without it "the app never
            # started" is as far as the diagnosis can go. Small and targeted on
            # purpose: `simctl diagnose` produces hundreds of MB per call.
            diag="/tmp/sim-diag/$(basename "$f" .dart)"
            mkdir -p "$diag"
            date -u > "$diag/when.txt"
            xcrun simctl list devices booted > "$diag/booted-devices.txt" 2>&1 || true
            xcrun simctl spawn "$SIMULATOR_UDID" launchctl list > "$diag/launchctl-list.txt" 2>&1 || true
            ps aux | grep -E "Simulator|adSdkExample|dart|flutter" | grep -v grep > "$diag/processes.txt" 2>&1 || true
            tail -n 3000 "$HOME/Library/Logs/CoreSimulator/$SIMULATOR_UDID/system.log" > "$diag/system.log" 2>&1 || true
            echo "::group::$f (retry)"
            if run_one "$f"; then
              echo "::endgroup::"
            else
              echo "::endgroup::"
              echo "::error file=$f::integration test failed on both attempts"
              failed+=("$f")
            fi
          done
          if [ ${#retried[@]} -ne 0 ]; then
            echo "::warning::Files that needed a retry: ${retried[*]}"
          fi
          if [ ${#failed[@]} -ne 0 ]; then
            echo "Failed files (both attempts): ${failed[*]}"
            exit 1
          fi

      # `if: always()`, not `if: failure()`: the whole point is the case where
      # the retry succeeded and the job is green, because that is exactly when
      # the flake would otherwise leave no trace. Nothing is uploaded on a
      # clean run — the directory only exists if some file needed a retry.
      - name: Upload simulator diagnostics from retried files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-diagnostics
          path: /tmp/sim-diag
          if-no-files-found: ignore

  # The host app is mostly UI-only (gated on static analysis) but now ships a
  # small test/ dir for screens with real logic (e.g. VipScreen stacking). It
  # consumes the SDK via the in-repo path override, so no publish is needed.
  host:
    name: host app — analyze & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.1'
          channel: 'stable'
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Run tests
        run: flutter test
