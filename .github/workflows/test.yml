name: CI

on:
  push:
    branches: [ main, develop ]
    # A commit touching ONLY docs does not need two ~25-minute integration
    # jobs: run 30708366878 spent 46 minutes of runner time on a single .md
    # file. Note this skips a run only when EVERY changed path matches — a
    # commit that touches code and docs together still runs the full suite.
    paths-ignore:
      - '**.md'
      - 'doc/**'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'doc/**'

# Pushing twice a few minutes apart used to leave two full runs (4 jobs each,
# ~35 min) racing, which both wastes runners and makes "which run is current"
# ambiguous. Supersede the older run instead.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compatibility-matrix:
    name: ad_sdk — compatibility matrix (${{ matrix.platform }}/${{ matrix.provider }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [android]
        provider: [admob, appLovin]
    defaults:
      run:
        working-directory: packages/ad_sdk
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.1'
          channel: stable
      - run: flutter pub get
      - name: Validate matrix target
        run: dart run tool/validate_compatibility_matrix.dart '${{ matrix.platform }}' '${{ matrix.provider }}'

  release-gate-static:
    name: ad_sdk — release readiness static gates
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/ad_sdk
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.1'
          channel: 'stable'
      - name: Install dependencies
        run: flutter pub get
      - name: Secret scan
        run: tool/release_readiness_gate.sh secret
      - name: Public API surface gate
        run: tool/release_readiness_gate.sh api
      - name: Package size gate
        run: tool/release_readiness_gate.sh size
      - name: Dependency and license lock gate
        run: tool/release_readiness_gate.sh dependency

  # The ad SDK package owns all the automated tests (unit/widget/integration
  # under packages/ad_sdk/test/). This is the primary gate.
  sdk:
    name: ad_sdk — analyze & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/ad_sdk
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.1'
          channel: 'stable'
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Run tests
        run: flutter test --coverage
      # T83 — no threshold gate yet, just a number every run so a coverage
      # regression is visible over time instead of living only in an
      # occasional manual audit note. lcov.info itself is the artifact;
      # the summary line is just for a quick look without downloading it.
      - name: Coverage summary
        if: always()
        run: |
          if [ -f coverage/lcov.info ]; then
            awk -F: '/^LF:/{lf+=$2} /^LH:/{lh+=$2} END{
              if (lf > 0) printf "Line coverage: %d/%d (%.1f%%)\n", lh, lf, (lh/lf)*100
            }' coverage/lcov.info | tee -a "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ad_sdk-coverage-lcov
          path: packages/ad_sdk/coverage/lcov.info
          if-no-files-found: warn

  # T85 — CLAUDE.md documents a CocoaPods pinning wall (applovin_max's exact
  # AppLovinSDK pin vs gma_mediation_applovin's), previously only verified by
  # hand before each release. tool/pinning_check_app/ is a minimal consuming-
  # app fixture reproducing the documented known-good combo (applovin_max
  # held back via dependency_overrides) — this job runs `pod install`
  # against it for real, so an incompatible version bump fails CI instead of
  # surfacing at release time.
  pinning-wall:
    name: ad_sdk — CocoaPods pinning-wall check
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.1'
          channel: 'stable'
      - name: Check pinning wall (pub get + pod install)
        run: packages/ad_sdk/tool/check_pinning_wall.sh

  # T47 — the integration_test/ files under packages/ad_sdk/example only ran
  # by hand on a simulator/device before this. Runs them on a real Android
  # emulator so real-device-shaped regressions (not just Dart-VM-reachable
  # ones) are caught in CI too. AdMob App ID/unit IDs in the example are
  # already Google's test IDs (see CLAUDE.md), so this is safe to run
  # unattended without risking real ad revenue/policy signals.
  sdk-integration:
    name: ad_sdk example — integration tests (Android emulator)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.1'
          channel: 'stable'
      - name: Install dependencies
        working-directory: packages/ad_sdk/example
        run: flutter pub get
      - name: Enable KVM (required for the emulator to boot on Linux runners)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # Flaky since ~2026-07-19: job gets killed mid-run with no test-failure
      # output and no uploaded logs — the signature of the Linux OOM killer,
      # not a real test failure (ubuntu-latest has 7GB RAM and no swap by
      # default; emulator + KVM + `flutter test` across every integration_test/
      # files can exceed that). Free up disk (unused dotnet/haskell/boost
      # toolchains) before adding swap — the AVD's userdata partition alone
      # needs ~7.4GB, so an oversized swapfile can starve emulator creation.
      - name: Free disk space (headroom for swap + emulator userdata partition)
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost
          docker image prune -af || true
          df -h /
      - name: Add swap space (avoids OOM-killed emulator on GitHub-hosted runners)
        run: |
          sudo swapoff -a
          sudo fallocate -l 3G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
      # Every test was failing identically at "SDK must finish initialising on
      # device" (30s timeout) — logcat (captured below) showed the real cause:
      # "SDK key provided is invalid (YOUR_86_CHAR_SDK_KEY_FROM_APPLOVIN_DASHBOARD)".
      # No real AppLovin credentials are committed (see main.dart T41 comment)
      # so the default AppLovin path can never init in CI. AD_PROVIDER_ADMOB
      # switches to Google's public AdMob test ad-unit IDs, which need no
      # secret and always init. (google_apis_playstore vs google_apis made no
      # difference to this — reverted to the plain image.)
      #
      # app_open/interstitial/rewarded_ad_test.dart are excluded below: their
      # own header comments say a HUMAN must manually tap the ad's close/X
      # button for the test to pass — there's no unattended way to dismiss a
      # real ad creative in headless CI, so they always time out here by
      # design, not from a regression. Run them by hand on a real device/sim.
      - name: Run integration tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          ram-size: 2048M
          heap-size: 256M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          working-directory: packages/ad_sdk/example
          # Same per-file isolation + one retry as the iOS job below — see
          # .github/scripts/integration-retry.sh, which both jobs share.
          #
          # Keep the body here to ONE command. Two attempts at an inline loop
          # both died on this runner: bash arrays gave
          # `Syntax error: "(" unexpected`, and after rewriting to POSIX a
          # multi-line `run_one() { ... }` gave
          # `/usr/bin/sh: 1: Syntax error: end of file unexpected (expecting })`
          # — note "1:", the body reaches sh collapsed onto a single line.
          # A script file sidesteps both and can be checked with `dash -n`.
          script: |
            adb logcat -c
            adb logcat > /tmp/logcat.txt &
            sh "$GITHUB_WORKSPACE/.github/scripts/integration-retry.sh" --dart-define=AD_PROVIDER_ADMOB=true

      - name: Upload logcat
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-emulator-logcat
          path: /tmp/logcat.txt
          if-no-files-found: ignore

  # N5 — the Android emulator job above never caught iOS-only regressions
  # (e.g. the ATT/UMP no-timeout wedge, App-Open auto-redirect on iOS
  # Simulator — see SKIP_ATT/SKIP_UMP/SKIP_SPLASH_AD dart-defines below).
  # Runs the same integration_test suite on an iOS Simulator.
  sdk-integration-ios:
    name: ad_sdk example — iOS Simulator (shard ${{ matrix.shard }}/3)
    runs-on: macos-15
    # Split across 3 runners. Every file pays its own ~49s Xcode build because
    # each is a separate Dart entrypoint (measured on run 30738772564: 18
    # builds, 14.6 min of a 41-min job) — that cost cannot be removed, only
    # spread. Sharding takes the job from ~41 min to ~16-18 min wall clock and
    # keeps per-file isolation, so a failure still names the file. Runners are
    # free here: the repo is public.
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    defaults:
      run:
        working-directory: packages/ad_sdk/example
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.1'
          channel: 'stable'
          cache: true
      # connectivity_plus 7.3.0 (transitive via internet_connection_checker_plus)
      # uses NWPath.isUltraConstrained, only in the iOS 26 SDK — the macos-15
      # image ships Xcode 26.1.1 but doesn't default to it.
      - name: Select Xcode 26.1.1
        run: sudo xcode-select -s /Applications/Xcode_26.1.1.app
      - name: Install dependencies
        run: flutter pub get
      # T87: caches ~/Library/Caches/CocoaPods (downloaded pod sources) and
      # the local Pods/ dir, keyed on Podfile.lock — pod install re-resolves
      # either way but skips re-downloading AppLovinSDK/GoogleMobileAds
      # source archives, which is most of this step's wall time. Does not
      # touch the simulator boot/log-stream logic below, so it can't
      # reintroduce the apsd/DDS flakiness those fixes were for.
      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: |
            packages/ad_sdk/example/ios/Pods
            ~/Library/Caches/CocoaPods
          key: ${{ runner.os }}-pods-${{ hashFiles('packages/ad_sdk/example/ios/Podfile.lock') }}
      - name: Install CocoaPods dependencies
        working-directory: packages/ad_sdk/example/ios
        run: pod install
      - name: Boot iOS Simulator
        run: |
          # Pin the RUNTIME, not just the device model. macos-15 ships iOS
          # 18.5, 18.6, 26.0, 26.1 and 26.2, and "iPhone 16" exists under every
          # one of them — so the old `grep -m1 'iPhone 16'` silently took the
          # first match, which is iOS **18.5**. Diagnostics captured from a
          # hung run (artifact ios-simulator-diagnostics, run 30730904622)
          # confirmed it: the booted device was an iPhone 16 Pro on iOS 18.5
          # while this job selects Xcode 26.1.1 above. Eight major versions of
          # runtime/toolchain skew, and it also meant CI never actually
          # exercised a current iOS.
          #
          # 26.1 to match Xcode 26.1.1 exactly — NOT "newest available", which
          # would pick 26.2, a runtime newer than the selected Xcode.
          #
          # Fail loudly if it is gone rather than falling back to an older
          # runtime: a red job that says why beats silently testing iOS 18
          # again.
          RUNTIME='iOS 26.1'
          UDID=$(xcrun simctl list devices available \
            | awk -v want="-- $RUNTIME --" '
                $0 == want {inblock = 1; next}
                /^-- / {inblock = 0}
                inblock && /iPhone 16/ {print; exit}' \
            | grep -oE '[0-9A-F-]{36}')
          if [ -z "$UDID" ]; then
            echo "::error::No iPhone 16 simulator under '$RUNTIME' on this image."
            xcrun simctl list devices available
            exit 1
          fi
          echo "Booting $RUNTIME simulator $UDID"
          echo "SIMULATOR_UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b

          # Silence Apple Push Service inside the simulator.
          #
          # This is the suspected cause of the 12-minute "app never started"
          # hangs, and the evidence is in the log-show.txt captured from the
          # hung run 30734786580: apsd logged
          #     <APSConnection: 0x...> Delivering connectionStatusChange from apsd: NO
          # **4250 times in 3 seconds**. The runner has no route to Apple's
          # push servers, so apsd retries in a tight loop and fans the result
          # out to every listening client. diagnosticd — the daemon that
          # serves `log stream` — was pegged at 42.9% CPU keeping up with it.
          #
          # That matters because `flutter test` on a simulator discovers the
          # app's VM-service URI by READING THE DEVICE LOG STREAM. Saturate
          # the stream and flutter never sees the URI: no Dart output at all,
          # then the 12-minute per-test timeout. Which is exactly the
          # signature, including why a different file is hit each run — it
          # depends on whether apsd happens to be spinning when flutter
          # attaches.
          #
          # Nothing under test uses push notifications. `|| true` because the
          # service name has moved between runtimes and a failure to stop it
          # must not fail the job — worst case we are back to today's flake.
          xcrun simctl spawn "$UDID" launchctl stop com.apple.apsd || true
          xcrun simctl spawn "$UDID" launchctl print system 2>/dev/null \
            | grep -c apsd || true
      # interstitial/rewarded show+dismiss need a real ad fill, which the
      # invalid placeholder AppLovin key (see Android job comment above) can
      # never provide — same AD_PROVIDER_ADMOB switch to Google's public
      # AdMob test ad-unit IDs fixes it here too.
      # app_open/interstitial/rewarded_ad_test.dart need a human to manually
      # tap the ad's close/X button (see their header comments) — excluded
      # below, same reason as the Android job above.
      #
      # One `flutter test` invocation PER FILE plus one retry — the loop lives
      # in .github/scripts/integration-retry.sh, shared with the Android job,
      # and carries the full rationale and the run IDs it came from. Short
      # version: a single invocation let one bad app launch hide the other 17
      # files behind a 12-minute timeout (run 30697397657).
      - name: Run integration tests
        run: |
          SHARD_TOTAL=3 SHARD_INDEX=${{ matrix.shard }} \
          sh "$GITHUB_WORKSPACE/.github/scripts/integration-retry.sh" \
            -d "$SIMULATOR_UDID" \
            --dart-define=SKIP_SPLASH_AD=true \
            --dart-define=SKIP_ATT=true \
            --dart-define=SKIP_UMP=true \
            --dart-define=AD_PROVIDER_ADMOB=true

      # `if: always()`, not `if: failure()`: the whole point is the case where
      # the retry succeeded and the job is green, because that is exactly when
      # the flake would otherwise leave no trace. Nothing is uploaded on a
      # clean run — the directory only exists if some file needed a retry.
      - name: Upload simulator diagnostics from retried files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          # Unique per shard: three jobs uploading the same artifact name
          # would collide.
          name: ios-simulator-diagnostics-shard-${{ matrix.shard }}
          path: /tmp/sim-diag
          if-no-files-found: ignore
