name: pinning_check_app
description: >
  T85 — not a real app. Minimal consumer fixture for the optional AdMob +
  AppLovin mediation dependency graph. Pins gma_mediation_applovin 2.6.2 with
  applovin_max ^4.6.4 and the SDK's google_mobile_ads >=9.0.0 <9.1.0 ceiling;
  the check asserts CocoaPods resolves AppLovinSDK 13.6.3. Run
  `tool/check_pinning_wall.sh` from the ad_sdk package root. Add
  `--with-builds` to compile the fixture for Android and iOS Simulator.
publish_to: 'none'
version: 0.0.1

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  applovin_admob_sdk:
    path: ../..
  # Pin to a specific version, not a range — this fixture exists to prove
  # ONE known combination resolves; letting it float would silently drift
  # to whatever's newest and stop testing the documented combo.
  gma_mediation_applovin: 2.6.2

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
