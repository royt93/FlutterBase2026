name: applovin_admob_sdk
# Must stay under 160 characters or pub.dev's "valid pubspec.yaml" check
# drops 10 points (the upload API itself allows up to 200 — two different
# limits, see the screenshots note below).
description: Dual-provider ad SDK for Flutter (AdMob + AppLovin MAX). Offline-verified VIP codes, GDPR/COPPA/CCPA consent, safety caps, AdEvent stream, debug overlay.
version: 3.0.3

# Monorepo: the package lives in packages/ad_sdk/ of the host app's repo, so
# `repository` points at the subdirectory (pub.dev resolves it for the
# "verified repository" badge and for source links).
repository: https://github.com/royt93/FlutterBase2026/tree/main/packages/ad_sdk
homepage: https://github.com/royt93/FlutterBase2026
issue_tracker: https://github.com/royt93/FlutterBase2026/issues

topics:
  - ads
  - admob
  - applovin
  - monetization
  - mediation

# Every runtime dependency (google_mobile_ads, applovin_max,
# app_tracking_transparency, advertising_id) is Android/iOS-only, so declaring
# this changes nothing pub.dev could not infer — it just stops a future
# desktop/web-capable dependency from silently widening the advertised
# platform list.
platforms:
  android:
  ios:

# Captured from example/ on a physical Android device in profile mode
# (--dart-define=AD_PROVIDER_ADMOB=true), so no debug banner and no real ad
# inventory is shown.
screenshots:
  # TWO different length limits apply, and neither is caught by
  # `pub publish --dry-run` (it reported 0 warnings at 207 chars):
  #   • the upload API rejects anything over 200 chars outright;
  #   • pana/pub.dev scoring wants under 160, or the "example and screenshots"
  #     check drops 10 points even though the upload succeeded.
  # Keep every description under 160.
  - description: >-
      Demo index — one page per ad surface (banner, MREC, native, interstitial,
      rewarded, app open) plus revenue, event-stream and diagnostics tooling.
    path: doc/screenshots/01_home.png
  - description: >-
      VipRedeemScreen — redeem an offline Ed25519-signed key or watch a rewarded
      ad for VIP time. While VIP is active every ad surface is suppressed.
    path: doc/screenshots/02_vip_redeem.png
  - description: >-
      The built-in ad-safety layer: live params vs the production and debug
      presets — throttle, session/hour/day caps, CTR fraud limits, dry-run.
    path: doc/screenshots/03_safety_status.png

environment:
  sdk: '>=3.6.0 <4.0.0'
  # 3.27.0+ is required because the SDK uses `Color.withValues(alpha:)`
  # introduced in that release. Pinning lower would compile-fail on older
  # Flutter versions.
  flutter: '>=3.27.0'

dependencies:
  flutter:
    sdk: flutter
  google_mobile_ads: ^7.0.0
  applovin_max: ^4.6.4
  app_tracking_transparency: ^2.0.7
  shared_preferences: ^2.5.0

  # Already present transitively — it IS the Android implementation of
  # shared_preferences above. Declared directly only because
  # `SharedPreferencesAsyncAndroidOptions` lives here and `shared_preferences`
  # does not re-export it, and that options class is the only way to point a
  # read at the app's DEFAULT preference file (`<packageName>_preferences`),
  # which is where Google UMP writes the IAB consent strings. See
  # lib/src/core/iab_storage.dart for why the other two stores the plugin can
  # talk to are the wrong ones. Deliberately a wide constraint: this is a
  # platform-implementation package, so pinning it narrowly would be one more
  # wall for a consuming app to hit (see CLAUDE.md on the pinning wall).
  # m7 — no upper cap on purpose. A `<3.0.0` bound here becomes a NEW pinning
  # wall for every consuming app the moment shared_preferences requires
  # shared_preferences_android 3.x (see CLAUDE.md on the pinning wall). The
  # canary test in test/iab_storage_canary_test.dart is what catches an API
  # break instead.
  shared_preferences_android: '>=2.4.0'
  advertising_id: ^2.7.1
  connection_notifier: ^4.1.0

  # Anti-uninstall-bypass guard for first-install VIP grace (iOS-side only).
  # See: lib/src/vip/_first_install_guard.dart
  # Android anti-bypass is handled by the host app's Auto Backup configuration
  # (`android:dataExtractionRules` restoring `FlutterSharedPreferences.xml`
  # on Play Store reinstall) — no plugin dependency needed.
  # Widened rather than pinned to ^10: 11.0.0 keeps the small surface this
  # package uses (`read`/`write`/`delete` + `IOSOptions.accessibility` +
  # `AndroidOptions`), and a `^10.0.0` cap would have started costing pub.dev
  # points as a stale dependency while also blocking consuming apps that
  # already moved to 11.
  #
  # This package itself still resolves 10.x, and that is not the constraint's
  # fault: flutter_secure_storage 11 pulls win32 ^6, while package_info_plus 9
  # (below) pins win32 ^5 — and package_info_plus 10, which would fix that,
  # needs Dart >= 3.10 / Flutter >= 3.38. Same wall as google_mobile_ads 8/9
  # (see CLAUDE.md): raising it means raising this package's own Flutter floor,
  # which is breaking for consumers. A consuming app already on Flutter 3.38+
  # can pull 11 today thanks to the wide bound here.
  flutter_secure_storage: '>=10.0.0 <12.0.0'   # iOS Keychain flag (survives uninstall by default)
  cryptography: ^2.9.0

  # C6 — the signed VIP key binds to a bundle id so a leaked key cannot be used
  # in a different app. Reading it here rather than taking it as a parameter
  # keeps a host from passing the wrong value (or forgetting it, which would
  # silently disable the check).
  package_info_plus: ^9.0.0
  confetti: ^0.8.0

  # Round-39 audit fix (MAJOR) — auto-pauses banner/MREC ads that go
  # off-screen without being disposed (e.g. a bare `IndexedStack` bottom-nav
  # tab, which gives Flutter's own `TickerMode`/`Visibility(maintainState:
  # true)` no signal at all — see banner_ad_widget.dart's own doc comment).
  # Maintained by the Flutter team itself; tiny, no transitive dependencies
  # of its own.
  visibility_detector: ^0.4.0+2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.0
  fake_async: ^1.3.1
  # Test-only: `InMemorySharedPreferencesAsync` lets the IAB consent-string
  # tests drive the SAME async platform interface production uses, instead of
  # the legacy `setMockInitialValues` mock they used before — which answered a
  # question the real store never receives, and so passed for four audit rounds
  # while `tcfConsentString` returned null on every device (MJ2).
  shared_preferences_platform_interface: '>=2.4.0 <3.0.0'
  # T217 — test/api_golden_test.dart walks the resolved public export
  # namespace of lib/applovin_admob_sdk.dart to catch breaking API changes.
  # Dev-only: never shipped to a consuming app's dependency graph.
  analyzer: ^7.3.0
  path: ^1.9.0

flutter:
  # This package does not use flutter_lints or other Flutter artifacts.
