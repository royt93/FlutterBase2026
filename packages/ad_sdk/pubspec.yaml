name: applovin_admob_sdk
description: Dual-provider ad SDK for Flutter (AdMob + AppLovin MAX). Adapter pattern, state machine, VIP redeem with Cupertino dialog, GDPR/COPPA/CCPA flags, exponential backoff, AdEvent stream, debug overlay.
version: 1.2.3

# Monorepo: the package lives in packages/ad_sdk/ of the host app's repo, so
# `repository` points at the subdirectory (pub.dev resolves it for the
# "verified repository" badge and for source links).
repository: https://github.com/royt93/FlutterBase2025/tree/main/packages/ad_sdk
homepage: https://github.com/royt93/FlutterBase2025
issue_tracker: https://github.com/royt93/FlutterBase2025/issues

topics:
  - ads
  - admob
  - applovin
  - monetization
  - mediation

# Every runtime dependency (google_mobile_ads, applovin_max,
# app_tracking_transparency, advertising_id) is Android/iOS-only, so declaring
# this changes nothing pub.dev could not infer — it just stops a future
# desktop/web-capable dependency from silently widening the advertised
# platform list.
platforms:
  android:
  ios:

# Captured from example/ on a physical Android device in profile mode
# (--dart-define=AD_PROVIDER_ADMOB=true), so no debug banner and no real ad
# inventory is shown.
screenshots:
  - description: >-
      The example app's demo index — one page per ad surface (banner, MREC,
      native, interstitial, rewarded, app open) plus revenue, slot-state,
      event-stream, compliance and diagnostics tooling.
    path: doc/screenshots/01_home.png
  - description: >-
      VipRedeemScreen — the shared VIP entitlement UI. Redeem an offline
      Ed25519-signed key or watch one rewarded ad for free VIP time; while VIP
      is active every ad surface is suppressed automatically.
    path: doc/screenshots/02_vip_redeem.png
  # pub.dev rejects a description over 200 characters (server-side, not caught
  # by `pub publish --dry-run`) — keep each one comfortably under that.
  - description: >-
      The built-in ad-safety layer: live params next to the production and debug
      presets — inter-ad throttle, session/hour/day caps, warmup and resume
      delays, click-rate and CTR fraud limits, dry-run.
    path: doc/screenshots/03_safety_status.png

environment:
  sdk: '>=3.6.0 <4.0.0'
  # 3.27.0+ is required because the SDK uses `Color.withValues(alpha:)`
  # introduced in that release. Pinning lower would compile-fail on older
  # Flutter versions.
  flutter: '>=3.27.0'

dependencies:
  flutter:
    sdk: flutter
  google_mobile_ads: ^7.0.0
  applovin_max: ^4.6.4
  app_tracking_transparency: ^2.0.7
  shared_preferences: ^2.5.0
  advertising_id: ^2.7.1
  connection_notifier: ^4.1.0

  # Anti-uninstall-bypass guard for first-install VIP grace (iOS-side only).
  # See: lib/src/vip/_first_install_guard.dart
  # Android anti-bypass is handled by the host app's Auto Backup configuration
  # (`android:dataExtractionRules` restoring `FlutterSharedPreferences.xml`
  # on Play Store reinstall) — no plugin dependency needed.
  flutter_secure_storage: ^10.0.0       # iOS Keychain flag (survives uninstall by default)
  cryptography: ^2.9.0
  confetti: ^0.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.0
  fake_async: ^1.3.1

flutter:
  # This package does not use flutter_lints or other Flutter artifacts.
