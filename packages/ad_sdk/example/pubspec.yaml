name: ad_sdk_example
description: Example app demonstrating the ad_sdk package.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.6.0 <4.0.0'
  flutter: '>=3.27.0'

dependencies:
  flutter:
    sdk: flutter

  applovin_admob_sdk:
    path: ../
  google_mobile_ads: ^7.0.0
  applovin_max: ^4.6.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_driver:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.0
  cryptography: ^2.9.0
  # Only integration_test/consent_resume_backstop_test.dart needs these: it
  # writes the real IAB TCF keys where a CMP would, in the platform store
  # IabStorage reads from, so the on-resume consent backstop can be proven
  # against the real plugin instead of a mock.
  shared_preferences: ^2.5.0
  package_info_plus: ^9.0.0

flutter:
  uses-material-design: true
