name: ad_sdk_example
description: Example app demonstrating the ad_sdk package.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.6.0 <4.0.0'
  flutter: '>=3.27.0'

dependencies:
  flutter:
    sdk: flutter

  applovin_admob_sdk:
    path: ../
  google_mobile_ads: ^7.0.0
  applovin_max: ^4.6.4
  # Only for the SharedPreferencesAsync type used by ConsentDemoPage's
  # "Simulate broken privacy store (T146)" button (via
  # IabStorage.debugOpenOverride, not by touching the real platform plugin).
  shared_preferences: ^2.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_driver:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.0
  cryptography: ^2.9.0
  package_info_plus: ^9.0.0
  # T154 — test/flutter_test_config.dart zeroes VisibilityDetector's debounce
  # timer for the whole suite (a real dependency of BannerAdWidget/
  # MrecAdWidget, transitively pulled in via applovin_admob_sdk already, but
  # not declared directly here before now).
  visibility_detector: ^0.4.0+2
  # T195 — integration_test/t195_concurrent_key_mint_test.dart constructs a
  # real FlutterSecureStorage() directly (to clear/reuse the same real
  # platform-channel entry signComplianceReport() itself defaults to),
  # transitively pulled in via applovin_admob_sdk already, but not declared
  # directly here before now.
  flutter_secure_storage: '>=10.0.0 <12.0.0'

flutter:
  uses-material-design: true
